- zapier:asana_list_projects
- zapier:buffer_get_posts
- zapier:calendly_book_meeting
- zapier:calendly_find_user
- zapier:calendly_get_user_availability
- zapier:chatgpt_analyze_text_sentiment
- zapier:docusign_add_user_to_workspace
- zapier:docusign_send_envelope
- zapier:google_ads_add_email_to_customer_list
- zapier:intercom_create_contact
- zapier:intercom_create_conversation
- zapier:linkedin_find_jobs
- zapier:quickbooks_update_vendor
- zapier:quickbooks_void_invoice
- zapier:trello_board_list
- zapier:zoho_desk_find_or_create_contact
catalog_only_reasons:
  zapier:asana_list_projects: no row; the bench has no route that lists projects
  zapier:buffer_get_posts: no row; the bench has no route that lists posts
  zapier:calendly_book_meeting: no row; the bench has no route that books an invitee onto an event type
  zapier:calendly_find_user: no row; the tool searches by name or email, the route reads one user by id
  zapier:calendly_get_user_availability: no row; the bench has no availability route
  zapier:chatgpt_analyze_text_sentiment: no row; a prompt template over chat completions, not a route of its own
  zapier:docusign_add_user_to_workspace: no row; the bench has no workspace-users route
  zapier:docusign_send_envelope: no row; sending is PUT envelope with status=sent and the seed exposes no status parameter
  zapier:google_ads_add_email_to_customer_list: no row; adding a member is an offline user-data job in three steps, not one route
  zapier:intercom_create_contact: no row; the bench has no plain contact create, only contacts:findOrCreateLead
  zapier:intercom_create_conversation: no row; the bench has no conversation create route
  zapier:linkedin_find_jobs: no row; the bench reads one job by id and has no job search
  zapier:quickbooks_update_vendor: no row; the POST /vendor route updates when the body carries Id, and the seed exposes no Id parameter
  zapier:quickbooks_void_invoice: no row; voiding needs operation=void with the invoice Id, and the seed exposes no Id parameter
  zapier:trello_board_list: no row; the tool finds or creates a list, and the bench has no list create route
  zapier:zoho_desk_find_or_create_contact: no row; the bench has no upsert route for contacts
