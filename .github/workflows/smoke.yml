# Paid smoke run: 10 tasks x 2 repetitions x the plan's competitors (about US$ 2
# for the default plan). Never runs a full round. Manual by default; the weekly
# schedule is commented out until the team turns it on.
name: smoke
on:
  workflow_dispatch:
    inputs:
      plan:
        description: "Plan file name under workflowbench/config/plans/"
        default: "smoke-frontier"
  # schedule:
  #   - cron: "0 9 * * 1"   # Mondays 09:00 UTC

defaults:
  run:
    working-directory: monarch-benchmark/workflowbench

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      FIREWORKS_API_KEY: ${{ secrets.FIREWORKS_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
      - run: git clone -q https://github.com/zapier/AutomationBench.git vendor/automation-bench && git -C vendor/automation-bench checkout -q 4a8e106
      - run: uv sync --frozen
      # No shell guard here any more: the approval gate lives in code. A plan
      # with more than 20 attempts per competitor is refused by `wb run` unless
      # the plan sets `approved_by`.
      - name: Doctor
        run: uv run wb doctor --arms claude-opus-4-8,gpt-5.6-sol
      - name: Smoke run
        id: run
        run: |
          RUN_ID="smoke-$(date -u +%Y%m%d-%H%M)"
          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"
          uv run wb run --product simulated-apps --plan "${{ inputs.plan }}" --run-id "$RUN_ID"
          uv run wb report "$RUN_ID" --audience internal --baseline claude-opus-4-8/api
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.run.outputs.run_id }}
          path: |
            monarch-benchmark/workflowbench/out/report-*.md
            monarch-benchmark/workflowbench/out/report-*.html
            monarch-benchmark/workflowbench/out/${{ steps.run.outputs.run_id }}/episodes.jsonl
