# Free checks on every push and pull request: no API keys, no model calls.
# - unit/integration tests against the simulated world
# - corpus validation: contract hashes unchanged, every check fails on the
#   untouched world (no-op), scripted oracle passes where one exists
name: ci
on:
  push:
    branches: [main]
  pull_request:

defaults:
  run:
    working-directory: monarch-benchmark/workflowbench

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
      - name: Vendor AutomationBench (upstream 1.0.6, pinned)
        run: git clone -q https://github.com/zapier/AutomationBench.git vendor/automation-bench && git -C vendor/automation-bench checkout -q 4a8e106
      - run: uv sync --frozen
      - name: Tests
        run: uv run python -m pytest tests -q
      - name: Corpus validation (pilot tasks + imported corpus)
        run: |
          uv run wb corpus validate tasks/
          uv run wb corpus validate corpus/imported-simple/
