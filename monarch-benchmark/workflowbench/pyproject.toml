[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "workflowbench"
version = "0.1.0"
description = "WorkflowBench T0: synthetic-mode world server, graph ingester, grader, pilot runner"
requires-python = ">=3.13"
dependencies = ["pydantic>=2.0", "mcp>=1.0", "automation-bench", "openai>=1.50", "google-genai>=1.0", "pyyaml>=6.0"]

[project.scripts]
wb = "wb_orchestrator.cli:main"

[dependency-groups]
dev = [
    "openapi-spec-validator>=0.9.0",
    "pytest>=9.0",
    "pytest-asyncio>=1.3",
]

# AutomationBench is vendored as a plain clone (see README "Setup"), pinned to
# upstream 1.0.6. Lucas's local copy carried extra repairs (1.0.6+evalrepair.10)
# that are not in this tree yet.
[tool.uv.sources]
automation-bench = { path = "vendor/automation-bench", editable = true }

[tool.hatch.build.targets.wheel]
packages = ["wb_world", "ingester", "grader", "runner", "wb_arms", "wb_orchestrator", "wb_results", "wb_stats", "wb_report", "wb_tenants", "legacy"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
