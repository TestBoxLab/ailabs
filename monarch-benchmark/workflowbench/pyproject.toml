[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "workflowbench"
version = "0.1.0"
description = "WorkflowBench T0: synthetic-mode world server, graph ingester, grader, pilot runner"
requires-python = ">=3.13"
dependencies = ["pydantic>=2.0", "mcp>=1.0", "automation-bench==1.0.6+evalrepair.10", "openai>=1.50", "google-genai>=1.0", "pyyaml>=6.0"]

[project.scripts]
wb = "wb_orchestrator.cli:main"

[dependency-groups]
dev = [
    "openapi-spec-validator>=0.9.0",
    "pytest>=9.0",
    "pytest-asyncio>=1.3",
]

# AutomationBench is vendored under vendor/automation-bench (gitignored) by
# scripts/vendor_automation_bench.py, which refuses any version other than the
# one pinned above. Since 8 Sep 2026 that is the repaired 1.0.6+evalrepair.10
# (ApplicationBench vendor subtree, Git tree 7ac9559); the world it came from
# is recorded in vendor/automation-bench/VENDORED-FROM.txt and the swap in
# specs/007-lab-foundation/dependency-adoption.md. The previous world, upstream
# 1.0.6 at 4a8e106, is what the frozen sets under tasks/ and corpus/ record.
[tool.uv.sources]
automation-bench = { path = "vendor/automation-bench", editable = true }

[tool.hatch.build.targets.wheel]
packages = ["wb_world", "ingester", "grader", "runner", "wb_arms", "wb_orchestrator", "wb_results", "wb_stats", "wb_report", "wb_tenants", "wb_studio", "legacy"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
