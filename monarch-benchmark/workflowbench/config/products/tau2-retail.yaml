name: tau2-retail
kind: simulated
world: tau2
description: Sierra retail customer-service tasks with an independently budgeted simulated customer.
data: {dataset: tau2-retail-base, mutable: true}
services: [tau2-retail]
side_effects: config/side-effects-tau2-retail.yaml
modes: [create-run]
source:
  benchmark: tau2
  version: "1.0.1"
  split: retail/base
  checker: Unchanged Sierra ALL reward with each task's original reward_basis and strict stored-trajectory replay
  positive_half_is_end_state_only: false
participants:
  - role: simulated-user
    model: gpt-5.6-sol
    price_table: gpt-5.6-sol
