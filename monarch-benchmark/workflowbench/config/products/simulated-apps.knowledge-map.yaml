# Why a row is what it is, when that is not obvious from the two ids; and why
# a catalog entry has no row. Notes on mapped rows are copied into the
# mapping report next to the pair.
notes:
  zapier:airtable_findManyRecords: "the table read; the route's filterByFormula does the matching the tool does with searchByField/searchByValue"
  zapier:asana_find_section: "the route lists a project's sections; the caller picks the one whose name matches"
  zapier:asana_list_projects: "no row; the bench has no route that lists projects"
  zapier:bamboohr_update_employee: "BambooHR updates an employee with POST /employees/{id}; the seed's verb says create because of the method"
  zapier:buffer_get_posts: "no row; the bench has no route that lists posts"
  zapier:buffer_list_channels: "Buffer's profiles are its channels"
  zapier:calendly_book_meeting: "no row; the bench has no route that books an invitee onto an event type"
  zapier:calendly_create_event_type: "the only event-type creation route makes a one-off event type"
  zapier:calendly_find_user: "no row; the tool searches by name or email, the route reads one user by id"
  zapier:calendly_get_user_availability: "no row; the bench has no availability route"
  zapier:calendly_list_invitees: "the route lists the invitees of one scheduled event (uuid); the tool lists across events"
  zapier:chatgpt_analyze_text_sentiment: "no row; a prompt template over chat completions, not a route of its own"
  zapier:chatgpt_chat_completion_memory: "chat completions with a system message; the conversation memory is the tool's own"
  zapier:chatgpt_send_prompt: "the legacy completions endpoint (prompt, stop, frequency_penalty, presence_penalty)"
  zapier:docusign_add_envelope_cc: "the recipients route takes carbonCopies as well as signers"
  zapier:docusign_add_user_to_workspace: "no row; the bench has no workspace-users route"
  zapier:docusign_create_envelope_from_template: "compositeTemplates on the envelope create"
  zapier:docusign_find_template: "by id; by name use bench-docusign:list:templates (search_text)"
  zapier:docusign_send_envelope: "no row; sending is PUT envelope with status=sent and the seed exposes no status parameter"
  zapier:docusign_void_envelope: "PUT envelope with voidedReason"
  zapier:gmail_create_draft_reply: "a draft whose message carries the threadId"
  zapier:gmail_mark_as_read: "messages/{id}/modify with removeLabelIds=[UNREAD]"
  zapier:google_ads_add_email_to_customer_list: "no row; adding a member is an offline user-data job in three steps, not one route"
  zapier:google_ads_find_campaign_by_name: "a GAQL query over campaign through googleAds:search"
