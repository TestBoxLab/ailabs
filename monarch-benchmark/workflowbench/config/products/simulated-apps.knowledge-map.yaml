# Which bench action each entry of the PG-Waki knowledge catalog describes.
#
# The catalog (research/architectures/pg-waki/v1/provenance.md) names its
# entries after AutomationBench's Zapier tools: `zapier:<app>_<tool>`. The
# bench's seeds name their actions after the simulated apps' REST routes:
# `bench-<app>:<verb>:<object>` (wb_world/seeds.py). The two were never the same
# thing -- a Zapier tool is a fixture replay over the app's state, a seed is one
# HTTP route -- so no rule derives one from the other. This table is the rule:
# a row says "the tool on the left performs, over the simulated app, the
# operation the route on the right performs". Read from the data on 8 September
# 2026 (every catalog entry beside every bench action, product by product) and
# checked against the routes' handlers where the row was not obvious.
#
# How rows were chosen:
#   * same product, same resource, same kind of effect (create, read, list,
#     update, delete, send);
#   * several tools may point at one route when they are aliases of each other
#     (gmail_find_email / gmail_list_emails) or special cases of one route
#     (three Gmail label tools are all messages/{id}/modify);
#   * a tool with no route that performs its operation has no row and is
#     reported as catalog-only, never guessed (see `notes` for the reasons);
#   * a route no tool describes is reported as bench-only.
#
# `wb monarch knowledge` reads this file next to the product file and refuses
# a row whose right-hand side the generator does not produce. Edit rows here,
# never in the generated seeds.

product: simulated-apps
catalog_id_scheme: "AutomationBench Zapier tool id, `zapier:<app>_<tool>`"
bench_id_scheme: "public-api-seeds@1 action id, `bench-<app>:<verb>:<object>`"

