name: monarch-team-bedrock
kind: price-table
provider: bedrock
region: us-west-2
prices_verified: 2026-09-03
description: >
  Bedrock prices for the models Monarch's authoring and engine may call.
  Prices from the Anthropic price list as of 2026-09-03 (claude-api skill,
  cached 2026-06-24); Bedrock us-west-2 lists the same per-token rates as
  Anthropic direct. Cache read = 10% of input, cache write (5 min) = 125% of
  input, matching the convention used in config/models/claude-opus-4-8.yaml.
models:
  - family: claude-opus-4-8
    match: [opus-4-8]
    usd_per_million: {input: 5.00, cached: 0.50, cache_write: 6.25, output: 25.00}
  - family: claude-opus-5
    match: [opus-5]
    usd_per_million: {input: 5.00, cached: 0.50, cache_write: 6.25, output: 25.00}
  - family: claude-sonnet-5
    match: [sonnet-5]
    usd_per_million: {input: 2.00, cached: 0.20, cache_write: 2.50, output: 10.00}
  - family: claude-sonnet-4-6
    match: [sonnet-4-6]
    usd_per_million: {input: 3.00, cached: 0.30, cache_write: 3.75, output: 15.00}
  - family: claude-haiku-4-5
    match: [haiku-4-5]
    usd_per_million: {input: 1.00, cached: 0.10, cache_write: 1.25, output: 5.00}
