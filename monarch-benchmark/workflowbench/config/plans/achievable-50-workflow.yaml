name: achievable-50-workflow
description: >
  Gauntlet round on the workflow track, creation plus execution (unblock plan
  of 8 Sep 2026, decisions D1 and D3): the 50 prompts of the ApplicationBench
  achievable50 slate, frozen as tasks/achievable-50 by `wb corpus slate`.
  Monarch builds a workflow for each request and runs it; bare Claude Opus 5
  through the API tool loop is the baseline; beside it the answer key, stock
  Monarch and Lucas's lab version (the same build with the reconstructed
  reviewed product knowledge seeded), both on Opus 5 through the Anthropic
  API. Prompts: 50; attempts per prompt: 1 plus 1 retry on failure; attempts
  per competitor: 50 to 100; competitors: 4; attempts in the round: 200 to
  400, of which up to 300 paid. Internal. Results are never pooled with the
  one-off request track (achievable-50-request).
track: create-run              # the competitor builds a workflow and runs it
tasks: tasks/achievable-50
mode: create-run
repetitions: 1                 # planned attempts per prompt and competitor
retry_on_fail: 1               # a failed prompt gets one more attempt, fresh data
timeout_s: 1800
concurrency: 4
competitors:
  - {harness: oracle}
  - {model: claude-opus-5, harness: api}
  # The two Monarch instances (D8). Their harness files,
  # config/harnesses/monarch-stock.yaml and monarch-lab.yaml, arrive with
  # milestone M5 (two Railway services, Opus 5 through the Anthropic API).
  # Until then this plan loads but `wb run` refuses it at resolve.
  - {harness: monarch-stock}
  - {harness: monarch-lab}
  # {model: claude-opus-5, harness: claude-code} joins with milestone M7, once
  # the Claude Code container passes its isolation checks (D10).
cost_ceiling_usd: 220          # per round; reserved in the weekly ledger before dispatch
baseline: claude-opus-5/api
audience: internal
approved_by: null              # Lucas approves (D5); a launch by Carlos waits for his approval
