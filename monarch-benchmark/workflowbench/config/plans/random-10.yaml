name: random-10
description: >
  Round on ten prompts drawn at random from the usable corpus except the thirty
  tier tasks, as an independent check on the blended average. Drawn by
  `wb corpus tiers --seed 20260904` and frozen;
  the same competitors and baseline as
  pilot-monarch-create-run, so the four difficulty rounds and the pilot can be
  read side by side. Prompts: 10; attempts per prompt: 1 plus
  1 retry on failure; attempts per competitor: 10 to 20; competitors: 7;
  attempts in the round: 70 to 140. Internal.
tasks: tasks/random-10
mode: create-run
repetitions: 1                 # planned attempts per prompt and competitor
retry_on_fail: 1               # a failed prompt gets one more attempt, fresh data
timeout_s: 1800
concurrency: 4
competitors:
  - {harness: oracle}
  - {model: kimi-k3-fireworks, harness: api}
  - {model: glm-5.3-fireworks, harness: api}
  - {model: claude-opus-5, harness: api}
  - {model: gpt-5.6-terra, harness: api}
  - {model: gpt-5.6-sol, harness: api}
  - {harness: monarch}
cost_ceiling_usd: 60
baseline: claude-opus-5/api
approved_by: null              # ignored since 8 Sep 2026: an approval is a record (wb approvals)
